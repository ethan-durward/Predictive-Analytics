{% extends 'betting/base.html' %}

{% block content %}
<div class="page-header">
    <div>
        <h1><i class="fas fa-cog me-2"></i>Preferences</h1>
        <p class="text-muted">Customize your ValueBet experience</p>
    </div>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card mb-4">
            <div class="card-header">
                <h5><i class="fas fa-book me-2"></i>Bookmaker Preferences</h5>
                <p class="mb-0 text-muted small">Select which bookmakers to include in your value bet search</p>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    
                    <div class="row">
                        {% for field in form %}
                            <div class="col-md-4 mb-3">
                                <div class="form-check">
                                    {{ field }}
                                    <label class="form-check-label" for="{{ field.id_for_label }}">
                                        {{ field.label }}
                                    </label>
                                </div>
                            </div>
                        {% endfor %}
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Save Preferences</button>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="text-center">
            <a href="{% url 'betting:profile' %}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-2"></i>Back to Profile
            </a>
        </div>
    </div>
</div>
{% endblock %}
