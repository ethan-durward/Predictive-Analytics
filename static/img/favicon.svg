<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded square background with shadow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg-gradient)" />
  
  <!-- Value arrow up -->
  <path d="M32,14 L44,26 L38,26 L38,38 L26,38 L26,26 L20,26 Z" fill="white" filter="url(#glow)" />
  
  <!-- Percentage symbol -->
  <g transform="translate(22, 30)">
    <!-- Top circle -->
    <circle cx="5" cy="5" r="4" stroke="white" stroke-width="2.5" fill="none" />
    <!-- Bottom circle -->
    <circle cx="15" cy="15" r="4" stroke="white" stroke-width="2.5" fill="none" />
    <!-- Diagonal line -->
    <line x1="2" y1="18" x2="18" y2="2" stroke="white" stroke-width="2.5" />
  </g>
  
  <!-- Decorative dot -->
  <circle cx="50" cy="14" r="3" fill="#9ddbff" />
</svg> 